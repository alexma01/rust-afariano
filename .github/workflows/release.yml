name: Release

# On a v* tag: a draft release with the CHANGELOG notes, the multi-arch image on
# GHCR, Linux and macOS binaries uploaded to the draft, then checksums and publish.
# Assets go straight to the release with the preinstalled `gh` CLI (no artifact
# actions in between).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG.md section of this version, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
      - name: Create the draft (unless the release exists)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists, assets will be replaced"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "rust-afariano ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi

  linux:
    name: Image and Linux binaries
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The Rust build cross-compiles with zig on the runner's own architecture;
      # only the final Alpine stage runs under QEMU for arm64.
      - name: Binaries (linux/amd64, linux/arm64)
        run: |
          set -o pipefail
          if ! docker buildx build --progress=plain --platform linux/amd64,linux/arm64 --target binaries \
               -o type=local,dest=dist . 2>&1 | tee build.log; then
            # Annotations are public, job logs are not: surface the tail there.
            tail -n 40 build.log | sed 's/%/%25/g' | awk 'BEGIN{printf "::error title=buildx failed::"} {printf "%s%%0A", $0} END{print ""}'
            exit 1
          fi
          mkdir -p assets
          for pair in amd64:x86_64 arm64:aarch64; do
            plat=${pair%%:*}; arch=${pair##*:}
            cp "dist/linux_${plat}/rust-afariano" "assets/rust-afariano-linux-${arch}"
            cp "dist/linux_${plat}/rust-afariano-runner" "assets/rust-afariano-runner-linux-${arch}"
          done
          chmod +x assets/*
          ls -l assets
      - name: Upload binaries to the release
        run: gh release upload "$GITHUB_REF_NAME" assets/* --clobber
      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0

  macos:
    name: macOS runner (aarch64)
    needs: draft
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p rust-afariano-runner
      - name: Upload the runner to the release
        run: |
          mkdir -p assets
          cp target/release/rust-afariano-runner assets/rust-afariano-runner-macos-aarch64
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber

  publish:
    name: Checksums and publish
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --pattern 'rust-afariano-*'
          sha256sum rust-afariano-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
      - name: Publish
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
