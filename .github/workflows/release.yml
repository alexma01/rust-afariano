name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  linux:
    name: Image and Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The Rust build cross-compiles with zig on the runner's own architecture;
      # only the final Alpine stage runs under QEMU for arm64.
      - name: Binaries (linux/amd64, linux/arm64)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --target binaries \
            --cache-from type=gha --cache-to type=gha,mode=max \
            -o type=local,dest=dist .
          mkdir -p assets
          for pair in amd64:x86_64 arm64:aarch64; do
            plat=${pair%%:*}; arch=${pair##*:}
            cp "dist/linux_${plat}/rust-afariano" "assets/rust-afariano-linux-${arch}"
            cp "dist/linux_${plat}/rust-afariano-runner" "assets/rust-afariano-runner-linux-${arch}"
          done
          chmod +x assets/*
          ls -l assets
      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: assets/*

  macos:
    name: macOS runner (aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p rust-afariano-runner
      - run: |
          mkdir -p assets
          cp target/release/rust-afariano-runner assets/rust-afariano-runner-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: assets/*

  release:
    name: GitHub release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd assets && sha256sum rust-afariano-* > SHA256SUMS && cat SHA256SUMS && cd ..
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG.md section of this version, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: assets/*
