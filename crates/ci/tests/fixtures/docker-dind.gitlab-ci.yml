# Synthetic example: tests inside docker-in-docker, a staging deploy, and a
# production deploy that waits to be started by hand. Pipelines start only by
# hand or through the API, on main and staging; pushes start nothing.

workflow:
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging")

stages:
  - test
  - deploy

# Docker jobs run on runners tagged docker-build, against their own
# docker:dind service.
.docker:
  tags: [docker-build]
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - apk add --no-cache bash git openssh-client >/dev/null

staging:deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  image: alpine:3
  resource_group: staging
  environment:
    name: staging
    url: https://staging.example.com
  timeout: 45m
  before_script:
    - apk add --no-cache bash git openssh-client >/dev/null
  script:
    - bash ci/staging-deploy.sh

production:test:
  extends: .docker
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  timeout: 1h
  script:
    - bash ci/production-test.sh

production:deploy:
  extends: .docker
  stage: deploy
  needs: [production:test]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  resource_group: production
  environment:
    name: production
  timeout: 2h
  script:
    - bash ci/production-deploy.sh
