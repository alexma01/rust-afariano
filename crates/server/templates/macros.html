{%- macro i(name) -%}
<svg class="i" aria-hidden="true"><use href="/-/static/icons.svg#i-{{ name }}"></use></svg>
{%- endmacro -%}

{%- macro icon(st) -%}
<svg class="ci-icon s-{{ st }}" aria-hidden="true"><use href="/-/static/icons.svg#st-{{ st }}"></use></svg>
{%- endmacro -%}

{%- macro badge(st, label) -%}
<span class="ci-badge s-{{ st }}"><svg class="ci-icon" aria-hidden="true"><use href="/-/static/icons.svg#st-{{ st }}"></use></svg>{{ label }}</span>
{%- endmacro -%}
